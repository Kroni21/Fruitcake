<html>
    <head>
        <style>
            .main{
                width: 100vw;
                height: 100vh;
                background-size: cover;
                background-position: center;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .d1{
                z-index: 999;
                padding-left: 30px;
            }
            .i1{
                position: absolute;
                width: 700px;
            }
            .i2{
                width: 260px;
                height: 130px;
                position: relative;
                padding-left: 25px;
                padding-top: 20px;
            }
            .nav1{
                display: flex;
                justify-content: space-between;
                margin: 0 1rem;
            }
            .toggler{
                position: relative;
                width: 50px;
                height: 50px;
                z-index: 999;
            }    
               
            .toggler span {
                position: absolute;
                display: block;
                height: 2px;
                width: 15px;
                background: #ff0101;
                left: 0;
                transition: top 0.5s, transform 0.5s;
            }
            
            .sp1{
                top: 20;
                width: 5px;
                height: 5px;
                z-index: 999;
                background-color: #fff;
                padding-left: 1px;
            }

            .sp2{
                top: 24;
                z-index: 999;
                width: 5px;
                height: 5px;
                padding-left: 1px;
            }

            .sp3{
                top: 28;
                z-index: 999;
                width: 5px;
                height: 5px;
                padding-left: 1px;
            }
            #toggle{
                display: none;
            }

            #toggle:checked~.toggler .sp1{
                transform: rotate(45deg);
                top: 24;
            }

            #toggle:checked~.toggler .sp2{
                 transform: rotate(45deg);
            }
            #toggle:checked~.toggler .sp3{
                transform: rotate(-45deg);
                top: 24;
            }
            .navigation{
                position: fixed;
                left: -100vw;
                top: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000d;
                transition: left 0.5s ease-in-out;
            }
            
            #toggle:checked~.navigation{
                left:0
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="nav1">
                <video src="doc_2026-04-25_13-20-26.mp4" autoplay loop class="i1"></video>
                <img src="Cookie_Run_Kingdom_2021_logo.webp" class="i2">
                <input type="checkbox" id="toggle">
                <label class="toggler" for="toggle">
                    <div>
                         <span class="sp1"></span>
                         <span class="sp2"></span>
                         <span class="sp3"></span>
                    </div>
                </label>
                <div class="navigation">
                    <h1 style="font-size: 5rem; color: #fff;">HI</h1>
                </div>    
            </div>
            <div class="d1">
                <span class="s4">A WORLD OF <br></span>
                <span class="s5">TEXTURES AND <br></span>
                <span class="s6">COLORS <br></span>
                <button>GET TEXTURES</button>
            </div>
            <span></span>
        </div>
    </body>
</html>
