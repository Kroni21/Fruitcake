<html>

<head>
    <style>
        body {
            font-family: "Rubik", sans-serif;
            font-optical-sizing: auto;
            font-weight: weight;
            font-style: normal;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 250px);
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;

        }

        .card1 {
            grid-column: 1/2;
            grid-row: 3/5;
            background-image: url(MFC1.jpg);
            background-size: cover;
            background-position: center;
        }

        .card2 {
            grid-column: 1/4;
            grid-row: 1/3;
            background-image: url(MFC4.jpg);
            background-size: cover;
            background-position: center;
        }

        .card3 {
            grid-column: 2/4;
            grid-row: 3/4;
            background-image: url(MFC3.jpg);
            background-size: cover;
            background-position: center;
        }

        .card4 {
            grid-column: 2/3;
            grid-row: 4/5;
            background-image: url(MFC6.jpg);
            background-size: cover;
            background-position: center;
        }

        .card5 {
            grid-column: 3/4;
            grid-row: 4/5;
            background-image: url(MFC7.jpg);
            background-size: cover;
            background-position: center;
        }

        .s1 {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin: 0;
            padding-top: 50px;
            padding-bottom: 20px;
        }

        .s2 {
            color: white;
            font-size: 27px;
        }
        .s3{
            color: white;
            font-size: 20px;
            margin-left: 30px;
            
        }
        .s4{
            color: #ffffffc6;
            font-size: 18px;
            margin-left: 30px;
        }
        .s5{
            color: #f9f5f5;
            font-size: 18px;
        }
        .s6{
            color: #6b6060;
            font-size: 18px;
            padding-left: 2px;
        }
        .d1 {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 100%;  
        }

        .d2 {
            margin-bottom: 200px;
        }

        .d3 {
            width: 360px;
            height: 400px;
            border: 5px solid white;
            border-radius: 20px;
        }

        .input1 {
            background-color: transparent;
            border: 0;
            border-bottom: 2px solid #fff;
            outline: none;
            color: white;
            margin-left: 30px;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .input1::placeholder{
            color: #5c615e80;
        }
        .button{
            border: none;
            border-radius: 20px;
            padding: 10px 30px;
            background-color: #e6ddcd;
            margin-left: 90px;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="dmain">
        <div class="grid">
            <div class="card card1"></div>
            <div class="card card2">
                <div class="d1">
                    <div class="d2">
                        <p class="s1">ZIGGI</p>
                        <span class="s2">
                            Concept-driven streetwear for <br>
                            those who move differently. <br>
                            We drop limited-edition drops, <br>
                            oversized hoodies, and essential <br>
                            tracksuits designed to survive <br>
                            the concrete jungle.
                        </span>
                    </div>
                    <div class="d3">
                        <p class="s3">VIP</p>
                        <p class="s4">Promo each month</p>
                        <div>
                            <input type="text" class="input1" placeholder="Name >">
                        </div>
                        <div>
                             <input type="text" class="input1" placeholder="Email >">
                        </div>
                        <div>
                             <input type="text" class="input1" placeholder="Mobile >">
                        </div>
                        <div>
                             <input type="text" class="input1" placeholder="Enquiry >">
                        </div>
                        <button class="button"><span class="s5">JOIN TODAY</span></button>
                        <p class="s4">You know the drill <span class="s6">T & C's.</span></p>
                    </div>
            </div>
            <div class="card card3"></div>
            <div class="card card4"></div>
            <div class="card card5"></div>
        </div>
    </div>
</body>

</html>
