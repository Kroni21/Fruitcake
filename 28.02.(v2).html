<!doctype html>
<html>
    <head>
        <style>
            .body{
                font-family: "Rubik", sans-serif;
                font-optical-sizing: auto;
                font-weight: weight;
                font-style: normal;
                margin: 0;
            } 
            .dm{
                height: 100vh;
                background-image: url("homura.avif");
                background-size: cover;
            }  
            .d1{
                display: flex;
                align-items: center;
                justify-content: space-around;
                border: 0;
                border-bottom: 1px solid #bcb8b8;
            }
            .d2{
                display: flex;
                align-items: center;
                width: 300px;
            }
            .d3{
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 300px;
            }
            .d4{
                display: flex;
                justify-content: center;
                flex-direction: column;
                width: 800px;
                height: 500px;
                padding-left: 70px;
            }
            .p1{
                font-size: 28px;
                font-weight: 700;
            }
            .p2{
                font-size: 28px;
            }
            .p3{
                font-size: 17px;
            }
            .p4{
                font-size: 17px;
                color: #a6e00a;
            }
            .p5{ 
                font-size: 20px;
            }
            .p6{
                font-size: 45px;
                margin: 0;
            }
            .p7{
                margin: 0;
                font-size: 15px;
                color:#4e4c4c;
            }
            .p8{
                margin: 0;
                margin-top: 30px;
                font-size: 15px;
                color:#4e4c4c;
            }
            .b1{
                width: 170px;
                height: 55px;
                background-color: #ffffff;
                border: solid 1px black;
            }
            .b2{
                margin-top: 30px;
                width: 150px;
                height: 50px;
                background-color: black;
                color: #ffffff;
                font-size: 17px;
            }
        </style>
    </head>
    <body class="body">
        <div class="dm">
            <div class="d1">
                <div class="d2">
                    <p class="p1">HOM</p>
                    <span class="p2">URA</span>
                </div>
                <div class="d3">
                    <span class="p4">Home</span>
                    <span class="p3">About</span>
                    <span class="p3">Properties</span>
                    <span class="p3">Services</span>
                </div>
                <button class="b1"><span class="p5">Contact Us</span></button>
            </div>
            <div class="d4">
                <p class="p6">Built for Modern</p>
                    <p class="p6">Living Solutions</p>
                    <p class="p8">Discover modern solutions</p>
                    <p class="p7">designed to support confident decisions,</p>
                    <p class="p7">simplify the buying proccess,and create</p>
                    <p class="p7">lasting valuy for every step forward.</p>
                    <button class="b2">Get Started</button>
            </div>
        </div>
    </body>
</html>
